<div class="forget-password-container">
  <div class="forget-password-card">
    <!-- Header -->
    <div class="header">
      <button (click)="goBack()" class="back-btn">
        <i class="fa fa-arrow-left"></i>
        Back to Login
      </button>
      <h2>Reset Password</h2>
    </div>

    <!-- Option Selection -->
    <div class="option-tabs">
      <button 
        (click)="selectOption('current')" 
        [class]="['tab-btn', { active: selectedOption === 'current' }]"
      >
        <i class="fa fa-key"></i>
        Change Current Password
      </button>
      <button 
        (click)="selectOption('otp')" 
        [class]="['tab-btn', { active: selectedOption === 'otp' }]"
      >
        <i class="fa fa-envelope"></i>
        Change with OTP
      </button>
    </div>

    <!-- Loading Spinner -->
    <div *ngIf="isLoading" class="loading-overlay">
      <div class="spinner"></div>
      <p>Processing...</p>
    </div>

    <!-- Current Password Option -->
    <div *ngIf="selectedOption === 'current'" class="form-container">
      <form [formGroup]="currentPasswordForm" (ngSubmit)="onChangeCurrentPassword()">
        <div class="form-group">
          <label for="identifier">Email Address or Username</label>
          <input 
            id="identifier"
            type="text" 
            formControlName="identifier" 
            placeholder="Enter your email or username"
            class="form-input"
          >
        </div>

        <div class="form-group">
          <label for="currentPassword">Current Password</label>
          <input 
            id="currentPassword"
            type="password" 
            formControlName="currentPassword" 
            placeholder="Enter current password"
            class="form-input"
          >
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input 
            id="newPassword"
            type="password" 
            formControlName="newPassword" 
            placeholder="Enter new password"
            class="form-input"
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input 
            id="confirmPassword"
            type="password" 
            formControlName="confirmPassword" 
            placeholder="Confirm new password"
            class="form-input"
          >
        </div>

        <button 
          type="submit" 
          class="submit-btn"
          [disabled]="currentPasswordForm.invalid || isLoading || currentPasswordForm.get('newPassword')?.value?.length < 6"
        >
          <i class="fa fa-lock"></i>
          {{ currentPasswordForm.get('newPassword')?.value?.length < 6 ? 'Password must be 6 characters long' : 'Change Password' }}
        </button>
      </form>
    </div>

    <!-- OTP Option -->
    <div *ngIf="selectedOption === 'otp'" class="form-container">
      <form [formGroup]="otpForm">
        <!-- Email/Username and Send OTP -->
        <div class="form-group">
          <label for="otpIdentifier">Email Address or Username</label>
          <input 
            id="otpIdentifier"
            type="text" 
            formControlName="identifier" 
            placeholder="Enter your email or username"
            class="form-input"
          >
        </div>

        <button 
          type="button" 
          (click)="onSendOtp()" 
          class="otp-btn"
          [disabled]="isLoading || isOtpButtonDisabled"
        >
          <i class="fa fa-paper-plane"></i>
          {{ isOtpButtonDisabled ? `Resend OTP (${formatTime(remainingTime)})` : 'Send OTP' }}
        </button>

        <!-- OTP and New Password (shown after OTP sent) -->
        <div *ngIf="otpSent" class="otp-section">
          <div class="form-group">
            <label for="otp">Enter OTP</label>
            <input 
              id="otp"
              type="text" 
              formControlName="otp" 
              placeholder="Enter 6-digit OTP"
              maxlength="6"
              class="form-input"
            >
          </div>

          <div class="form-group">
            <label for="otpNewPassword">New Password</label>
            <input 
              id="otpNewPassword"
              type="password" 
              formControlName="newPassword" 
              placeholder="Enter new password"
              class="form-input"
            >
          </div>

          <div class="form-group">
            <label for="otpConfirmPassword">Confirm New Password</label>
            <input 
              id="otpConfirmPassword"
              type="password" 
              formControlName="confirmPassword" 
              placeholder="Confirm new password"
              class="form-input"
            >
          </div>

          <button 
            type="button" 
            (click)="onChangePasswordWithOtp()" 
            class="submit-btn"
            [disabled]="otpForm.invalid || isLoading || otpForm.get('newPassword')?.value?.length < 6"
          >
            <i class="fa fa-check"></i>
            {{ otpForm.get('newPassword')?.value?.length < 6 ? 'Password must be 6 characters long' : 'Reset Password' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<app-popup
  [show]="showPopup"
  title="Alert"
  [message]="popupMessage"
  [redirectTo]="redirectPath"
  (close)="closePopup()">
</app-popup>
