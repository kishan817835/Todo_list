<div class="overlay" *ngIf="show">
  <div class="popup">
    <div class="popup-header">
      <h2>{{ title }}</h2>
    </div>

    <div class="popup-body">
      <p>{{ message }}</p>
    </div>

    <div class="popup-footer">
      <button class="ok-btn" (click)="onOk()">OK</button>
    </div>
  </div>
</div>
