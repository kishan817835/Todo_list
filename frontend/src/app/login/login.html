<div class="main-container">
  <div class="sign-in-container">
     <div class="login-image">
    <img src="https://img.freepik.com/premium-vector/woman-face-round-avatar_594966-10.jpg?w=2000" alt="Login Image" />
  </div>
    <form #loginForm="ngForm">
  <div class="input-field">
    <i class="fa fa-user"></i>
   <input
  type="text"
  name="identifier"
  [(ngModel)]="loginData.login"
  required
  placeholder="Email or Username"
/>

  </div>

  <div class="input-field">
    <i class="fa fa-lock"></i>
    <input
      type="password"
      name="password"
      [(ngModel)]="loginData.password"
      required
      placeholder="Password"
    />
  </div>

  <button
    type="button"
    (click)="onLogin()"
    [disabled]="loginForm.invalid"
    class="login-btn"
  >
    Sign In
  </button>
  <div class="forgot-password">
    <a (click)="goToForgotPassword()" class="forgot-link">Forgot Password?</a>
  </div>
  <p class="mobile-register">
  Don’t have an account?
  <a (click)="goToRegister()" class="ghost" id="signUp">Sign Up</a>
</p>

</form>

  </div>
  <div class="sign-up-container">
    <form action="#">
      <h1>Hello, Friend!</h1>
      <p>Enter your personal details and start journey with us</p>
      <button (click)="goToRegister()" class="ghost" id="signUp">Sign Up</button>
    </form>
  </div>
  <div class="overlay-container">
    <div class="overlay">
      <div class="overlay-panel overlay-left">
        <h1>Welcome Back!</h1>
        <p>To keep connected with us please login with your personal info</p>
        <button class="ghost" id="signIn">Sign In</button>
      </div>
      <div class="overlay-panel overlay-right">
        <h1>Hello, Friend!</h1>
        <p>Enter your personal details and start journey with us</p>
        <button (click)="goToRegister()" class="ghost" id="signUp">Sign Up</button>
      </div>
    </div>
  </div>
</div>
<app-popup
  [show]="showPopup"
  title="Alert"
  [message]="popupMessage"
  [redirectTo]="redirectPath"
  (close)="closePopup()">
</app-popup>
